<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awwiechat - Login</title>
</head>
<body>
    
    <!---Login page-->

    <img src="#" alt = "logo">

    <h1> Awwiechat - Login</h1>

    <!---Form-->

    <form method ="POST" action="{{url_for('login')}}">
        <input type = "text" id = "lgnu" name = "LoginAwwieU" placeholder="Your username here" required>
        <input type = "password" id = "lgnp" name = "LoginAwwieP" placeholder="Your password here"required>

        <input type="submit" value = "LogIn">

        <h3> Not a user ?? <a href = "{{url_for('signup')}}">Signup</a></h3>
        </form>

        <!---Flashed message from backend-->

        {% with message = get_flashed_messages() %}
        {% for message in messages %}

        <p> {{ message }}</p>

        {% endfor %}
        {% endwith %}
</body>
</html>
